x-dify-common: &dify-common
  image: langgenius/dify-api:${DIFY_VERSION:-0.15.3}
  restart: unless-stopped
  environment: &dify-env
    MODE: api
    LOG_LEVEL: INFO
    SECRET_KEY: ${SECRET_KEY:-llm-security-lab-secret-key}
    INIT_PASSWORD: ${INIT_PASSWORD:-admin123}
    CONSOLE_WEB_URL: http://localhost:${DIFY_WEB_PORT:-3000}
    CONSOLE_API_URL: http://localhost:${DIFY_API_PORT:-5001}
    SERVICE_API_URL: http://localhost:${DIFY_API_PORT:-5001}
    APP_WEB_URL: http://localhost:${DIFY_WEB_PORT:-3000}
    DB_USERNAME: ${POSTGRES_USER:-dify}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-difypass123}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-dify}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass123}
    REDIS_DB: 0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/1
    VECTOR_STORE: weaviate
    WEAVIATE_ENDPOINT: http://weaviate:8080
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: /app/api/storage
    CODE_EXECUTION_ENDPOINT: http://sandbox:8194
    CODE_EXECUTION_API_KEY: dify-sandbox
    SSRF_PROXY_HTTP_URL: ""
    SSRF_PROXY_HTTPS_URL: ""
  volumes:
    - dify_storage:/app/api/storage
  networks:
    - llm-lab-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    weaviate:
      condition: service_started

services:
  # ============================================================
  # Dify 핵심 서비스
  # ============================================================
  dify-api:
    <<: *dify-common
    container_name: llm-lab-dify-api
    environment:
      <<: *dify-env
      MODE: api
    ports:
      - "${DIFY_API_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dify-worker:
    <<: *dify-common
    container_name: llm-lab-dify-worker
    environment:
      <<: *dify-env
      MODE: worker

  dify-web:
    image: langgenius/dify-web:${DIFY_VERSION:-0.15.3}
    container_name: llm-lab-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: http://localhost:${DIFY_API_PORT:-5001}
      APP_API_URL: http://localhost:${DIFY_API_PORT:-5001}
    ports:
      - "${DIFY_WEB_PORT:-3000}:3000"
    networks:
      - llm-lab-network

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.10
    container_name: llm-lab-sandbox
    restart: unless-stopped
    environment:
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: 15
    networks:
      - llm-lab-network

  # ============================================================
  # 데이터 저장소
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: llm-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-difypass123}
      POSTGRES_DB: ${POSTGRES_DB:-dify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dify}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llm-lab-network

  redis:
    image: redis:7-alpine
    container_name: llm-lab-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llm-lab-network

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.26.6
    container_name: llm-lab-weaviate
    restart: unless-stopped
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "${WEAVIATE_PORT:-8081}:8080"
    networks:
      - llm-lab-network

  # ============================================================
  # 실습 전용 서비스
  # ============================================================
  faq-chatbot:
    build:
      context: ../apps/faq-chatbot
      dockerfile: Dockerfile
    container_name: llm-lab-faq
    restart: unless-stopped
    ports:
      - "${FAQ_CHATBOT_PORT:-5050}:5050"
    networks:
      - llm-lab-network

  customer-chatbot:
    build:
      context: ../apps/customer-chatbot
      dockerfile: Dockerfile
    container_name: llm-lab-customer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CUSTOMER_CHATBOT_PORT:-5051}:5051"
    networks:
      - llm-lab-network

  internal-chatbot:
    build:
      context: ../apps/internal-chatbot
      dockerfile: Dockerfile
    container_name: llm-lab-internal
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${INTERNAL_CHATBOT_PORT:-5052}:5052"
    networks:
      - llm-lab-network

  api-server:
    build:
      context: ../apps/api-server
      dockerfile: Dockerfile
    container_name: llm-lab-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_SERVER_PORT:-5053}:5053"
    networks:
      - llm-lab-network

volumes:
  postgres_data:
    name: llm-lab-postgres
  redis_data:
    name: llm-lab-redis
  weaviate_data:
    name: llm-lab-weaviate
  dify_storage:
    name: llm-lab-dify-storage

networks:
  llm-lab-network:
    name: llm-lab-network
    driver: bridge
